persistence:
  enabled: true
  size: 1Gi

initChownData:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 300m
    memory: 256Mi

service:
  type: ClusterIP

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://cloudcart-prometheus-server.monitoring.svc.cluster.local
        isDefault: true
